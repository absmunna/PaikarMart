services:
  # Render Free Web Service for Node.js Express Backend (Zero Billing Required)
  - type: web
    name: paikarmart-backend
    env: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0609196204
      - key: CORS_ORIGINS
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: COURIER_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
