      (function () {
        try {
          var canonicalUrl = window.location.origin + window.location.pathname;
          var canonicalLink = document.querySelector('link[rel="canonical"]');

          if (ogUrlMeta) ogUrlMeta.setAttribute('content', canonicalUrl);

      })();

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      (function () {
        function isViteWsNoise(text) {
          return (
            text.indexOf('@vite/client') !== -1 ||
            text.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1
          );
        }
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var text =
              ((reason && reason.message) || '') +
              ' ' +
              ((reason && reason.stack) || '') +
              ' ' +
              String(reason || '');
            if (isViteWsNoise(text)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (event) {
            var targetIsWs = typeof WebSocket !== 'undefined' && event.target instanceof WebSocket;
            var text =
              (event.message || '') +
              ' ' +
              (event.filename || '') +
              ' ' +
              ((event.error && event.error.stack) || '');
            if (targetIsWs || isViteWsNoise(text)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
